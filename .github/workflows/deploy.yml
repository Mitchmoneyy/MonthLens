name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # pull requests (including automatic dependency updates) run every check but never deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      # Account config (public values) comes from .env.production in the repo, or from the
      # SUPABASE_URL / SUPABASE_ANON_KEY repository variables if those are set.
      - name: Build the web app
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SB_URL" ]; then export VITE_SUPABASE_URL="$SB_URL" VITE_SUPABASE_ANON_KEY="$SB_KEY"; fi
          npm run build
      # Browser tests against the built site: the acceptance tests, imports with real OCR,
      # offline mode, and the account flow against a stand-in server.
      - name: Browser tests
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install chromium
          node scripts/e2e.mjs
          node scripts/a11y.mjs
          node scripts/e2e-account.mjs
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
